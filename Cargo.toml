[workspace]
members = ["crates/core", "crates/manifest", "crates/bank", "crates/audioware"]
resolver = "3"

[workspace.package]
version = "1.9.9"
edition = "2024"
rust-version = "1.97.1"

[profile.release]
codegen-units = 1

[profile.staging]
inherits = "release"
debug = true

[workspace.dependencies]
audioware-core = { path = "crates/core" }
audioware-manifest = { path = "crates/manifest" }
audioware-bank = { path = "crates/bank" }
either = "1.15.0"
glam = "0.33.0"
humantime = "2.3"
# macOS port (branch macos-dev): no git downloads on the build machine, so kira and red4ext-rs come from local checkouts next to this one.
# - kira: ports/kira-roms1383 is Roms1383's fork at the very commit the upstream line below pins (10e78eea); nothing is patched.
#   A public build keeps the upstream line:
#   kira = { git = "https://github.com/Roms1383/kira", rev = "10e78eea757d564530c6d04d8d98849650b94862", features = ["serde"] }
# - red4ext-rs: ports/red4ext-rs-mac is branch macos-dev of our fork (jac3km4/red4ext-rs d419d98 plus the macOS port). A public build
#   pins the fork instead (rev = a pushed commit of branch macos-dev; the Windows lines of the fork are unchanged):
#   red4ext-rs = { git = "https://github.com/codeman101/red4ext-rs", rev = "<macos-dev commit>" }
#   red4ext-rs builds RED4ext.SDK with CMake; on macOS it needs RED4EXT_SDK_DIR=<checkout of RED4ext.SDK-macos branch mac-rs>.
kira = { path = "../kira-roms1383/crates/kira", features = ["serde"] }
rayon = "1.11"
red4ext-rs = { path = "../red4ext-rs-mac" }
serde = "1.0"
snafu = "0.9"

[profile.dev.package.kira]
opt-level = 3

[profile.dev.package.cpal]
opt-level = 3

[profile.dev.package.symphonia]
opt-level = 3

[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3

[profile.dev.package.symphonia-format-ogg]
opt-level = 3

[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3

[profile.dev.package.symphonia-bundle-flac]
opt-level = 3

[profile.dev.package.symphonia-codec-pcm]
opt-level = 3
